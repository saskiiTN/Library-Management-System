<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Affectation</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>
        .inputStyle{
            border:solid rgb(207, 207, 207) 1px;
            width: 500px;
            height: 25px;
            border-radius: 5px;
            margin-block: 10px;
        }
        .mainContainer{
            margin: auto;
            padding: 20px;
            border: solid black 1px;
            width: 600px;
        }
        .GreenButton{
            height: 35px;
            width: 80px;
            color:white;
            background-color: #04AA6D;
            border-radius: 5px;
            border: none;
        }
        table,th,td{
            border: 1px solid rgb(178, 177, 177);
            border-collapse: collapse;
            text-align: left;
        }
        th{
            
            background-color: rgb(222, 222, 222);
            
        }
        th,th{
            padding-inline: 15px;
            height: 35px;
        }
        select{
                height: 35px;
        }
    </style>
</head>

<body>
<div class="mainContainer">
        <h2>Affecter un auteur à un livre</h2>

        <form th:action="@{/affectation}" method="post">

        Livre :

        <select name="isbn" >
        <option value="" disabled selected hidden>Sélectionner un livre</option>
        <option th:each="l : ${livres}"
                th:value="${l.isbn}"
                th:text="${l.titre}">
        </option>

        </select>

        <br><br>

        Auteur :

        <select name="auteurId">
        <option value="" disabled selected hidden>Sélectionner un auteur</option>
        <option th:each="a : ${auteurs}"
                th:value="${a.id}"
                th:text="${a.nomPrenom}">
        </option>

        </select>

        <br><br>

        <button class="GreenButton" type="submit">Affecter</button>

        </form>
        <br>
        <hr>

        <h2>Liste des auteurs</h2>

        <table border="1">

        <tr>
        <th style="width: 70px;">ID</th>
        <th style="width: 300px;">Nom</th>
        <th style="width: 120px;">Points</th>
        </tr>

        <tr th:each="a : ${auteurs}">
        <td th:text="${a.id}"></td>
        <td th:text="${a.nomPrenom}"></td>
        <td th:text="${a.nombrePoint}"></td>
        </tr>

        </table>
        <a href="/">Retour au menu</a>
</div>

</body>
</html>
