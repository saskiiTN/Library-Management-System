<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livres</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .inputStyle{
            border:solid rgb(207, 207, 207) 1px;
            width: 500px;
            height: 25px;
            border-radius: 5px;
            margin-block: 10px;
        }
        .mainContainer{
            margin: auto;
            padding: 20px;
            border: solid black 1px;
            width: 600px;
        }
        .GreenButton{
            height: 35px;
            width: 80px;
            color:white;
            background-color: #04AA6D;
            border-radius: 5px;
            border: none;
        }
        table,th,td{
            border: 1px solid rgb(178, 177, 177);
            border-collapse: collapse;
            text-align: left;
        }
        th{
            
            background-color: rgb(222, 222, 222);
            
        }
        th,th{
            padding-inline: 15px;
            height: 35px;
        }
    </style>
</head>

<body>

<div class="mainContainer">
    <h2>Gestion des Livres</h2>

    <form th:action="@{/livres/add}" th:object="${livre}" method="post">

        ISBN:<br>
        <input class="inputStyle" type="text" th:field="*{isbn}" />
        <br><br>

        Titre:<br>
        <input class="inputStyle" type="text" th:field="*{titre}" />
        <br><br>

        Année de parution:<br>
        <input class="inputStyle" type="number" th:field="*{anneeParution}" />
        <br><br>

        <button class="GreenButton" type="submit">Ajouter</button>

    </form>


    <h2>Liste des livres</h2>

    <table border="1">

    <tr>
        <th style="width: 100px;">ISBN</th>
        <th style="width: 280px;">Titre</th>
        <th style="width: 120px;">Année</th>
    </tr>

    <tr th:each="l : ${livres}">
        <td th:text="${l.isbn}"></td>
        <td th:text="${l.titre}"></td>
        <td th:text="${l.anneeParution}"></td>
    </tr>

    </table>
    <a href="/">Retour au menu</a>
</div>

</body>
</html>
